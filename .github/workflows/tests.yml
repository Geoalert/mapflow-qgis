name: tests

on:
  push:
    branches:
      - dev
      - master
  pull_request:

permissions:
  contents: read

jobs:
  qgis3:
    name: QGIS 3 (Qt 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit and end-to-end tests
        run: make test-qgis3

  qgis4:
    name: QGIS 4 (Qt 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit and end-to-end tests, Qt 6 code check
        run: make test-qgis4

  lint:
    name: Static analysis (qgis.org checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run flake8 + bandit + detect-secrets
        # Blocking on purpose: a check that cannot fail the build does not hold a line.
        run: make lint

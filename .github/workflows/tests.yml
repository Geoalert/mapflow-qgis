name: tests

on:
  push:
    branches:
      - dev
      - master
  pull_request:

permissions:
  contents: read

jobs:
  qgis3:
    name: QGIS 3 (Qt 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit and end-to-end tests
        run: make test-qgis3

  qgis4:
    name: QGIS 4 (Qt 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit and end-to-end tests, Qt 6 code check
        run: make test-qgis4

  qt6:
    name: Qt 6 without QGIS (PyQt6)
    # ubuntu-24.04, not -latest: the package names below are the ones of 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Libraries that offscreen Qt 6 loads
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglib2.0-0t64 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libgssapi-krb5-2
      - name: Install PyQt6
        run: python -m pip install PyQt6
      - name: The pages, sign-in and HTTP client on PyQt6
        run: make test-qt6

  lint:
    name: Static analysis (qgis.org checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run flake8 + bandit + detect-secrets
        # Blocking on purpose: a check that cannot fail the build does not hold a line.
        run: make lint

name: tests

on:
  push:
    branches:
      - dev
      - master
  pull_request:

permissions:
  contents: read

jobs:
  functional:
    name: Functional tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run functional tests
        run: make test-functional

  qgis:
    name: QGIS tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run qgis tests
        run: make test-qgis

  ui:
    name: UI tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ui tests
        # No UI tests authored yet — `make test-ui` treats pytest's
        # exit-5 (no tests collected) as a pass. Real xvfb / image
        # failures still fail the job.
        run: make test-ui

  lint:
    name: Static analysis (qgis.org checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run flake8 + bandit + detect-secrets
        # Blocking on purpose. Without a gate, every finding-reduction MR is a
        # snapshot the next MR can silently undo — which is how ~1400 findings
        # accumulated in the first place. Suppressions belong in .flake8 where
        # they are visible and attributed, not in a non-blocking job.
        run: make lint

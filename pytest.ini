[pytest]
# Repo root must be on sys.path so `import mapflow_next` and `tests.*` resolve.
# test_e2e.py runs the end-to-end flow (tests/e2e_flow.py) in its own process; it is skipped where
# PyQGIS is not importable. tests/qt6_ui.py is run directly (make test-qt6), not collected.
pythonpath = .
testpaths = tests
